<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
        }
        .login-box {
            width: 340px;
            padding: 28px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
        }
        h1 {
            margin: 0 0 20px;
            font-size: 22px;
        }
        label {
            display: block;
            margin-bottom: 14px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 9px 10px;
            border: 1px solid #d5d9e0;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 5px;
            color: #fff;
            background: #4f7cff;
            font-size: 15px;
            cursor: pointer;
        }
        .error {
            margin-bottom: 14px;
            color: #d14343;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>管理员登录</h1>

        {% if form.errors %}
        <p class="error">用户名或密码不正确</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label>
                用户名
                {{ form.username }}
            </label>
            <label>
                密码
                {{ form.password }}
            </label>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
